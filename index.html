<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net;">
  <title>ChatAgent - AI 智能助手</title>
  <link rel="stylesheet" href="style.css">
  <!-- Markdown 渲染 & 代码高亮 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github.min.css">
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/core.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/javascript.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/python.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/java.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/cpp.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/c.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/sql.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/xml.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/css.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/json.min.js"></script>
</head>
<body>
  <div class="container">
    <!-- 标题栏 -->
    <header class="header">
      <h1>🤖 ChatAgent</h1>
      <div class="api-status" id="apiStatus">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">检查中...</span>
      </div>
    </header>

    <!-- 设置区域 -->
    <div class="settings" id="settingsPanel">
      <div class="settings-row">
        <label for="providerSelect">服务商：</label>
        <select id="providerSelect"></select>
        <label for="modelInput">模型：</label>
        <input type="text" id="modelInput" list="modelList" placeholder="选择或输入模型名称">
        <datalist id="modelList"></datalist>
      </div>
      <div class="settings-row">
        <label for="baseUrlInput">API 地址：</label>
        <input type="text" id="baseUrlInput" placeholder="https://api.example.com/v1">
        <label for="apiKey">API Key：</label>
        <input type="password" id="apiKey" placeholder="输入 API Key">
        <button id="saveKeyBtn">保存配置</button>
        <span id="saveStatus"></span>
      </div>
      <div class="settings-note" id="providerNote"></div>
    </div>

    <!-- 对话区域 -->
    <div class="chat-container" id="chatContainer">
      <div class="welcome-message">
        <p>👋 你好！我是 ChatAgent 智能助手</p>
        <p>支持 DeepSeek / OpenAI / 通义千问 / 智谱 / Kimi / Claude 等主流模型</p>
        <p class="tip">💡 提示：先在顶部设置中选择服务商并配置 API Key</p>
      </div>
    </div>

    <!-- 输入区域 -->
    <div class="input-area">
      <textarea 
        id="userInput" 
        placeholder="输入您的问题..."
        rows="3"
      ></textarea>
      <button id="sendBtn">发送</button>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
