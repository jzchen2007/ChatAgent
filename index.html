<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net;">
  <title>DeepSeek 智能问答</title>
  <link rel="stylesheet" href="style.css">
  <!-- Markdown 渲染 & 代码高亮 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github.min.css">
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/core.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/javascript.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/python.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/java.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/cpp.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/c.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/sql.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/xml.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/css.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/json.min.js"></script>
</head>
<body>
  <div class="container">
    <!-- 标题栏 -->
    <header class="header">
      <h1>🤖 DeepSeek 智能问答</h1>
      <div class="api-status" id="apiStatus">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">检查中...</span>
      </div>
    </header>

    <!-- 设置区域 -->
    <div class="settings" id="settingsPanel">
      <label for="apiKey">API Key：</label>
      <input type="password" id="apiKey" placeholder="输入你的 DeepSeek API Key">
      <button id="saveKeyBtn">保存</button>
      <span id="saveStatus"></span>
    </div>

    <!-- 对话区域 -->
    <div class="chat-container" id="chatContainer">
      <div class="welcome-message">
        <p>👋 你好！我是 DeepSeek 智能助手</p>
        <p>请在顶部输入你的问题，我会尽力帮助你回答！</p>
        <p class="tip">💡 提示：需要先在设置中配置 API Key</p>
      </div>
    </div>

    <!-- 输入区域 -->
    <div class="input-area">
      <textarea 
        id="userInput" 
        placeholder="输入您的问题..."
        rows="3"
      ></textarea>
      <button id="sendBtn">发送</button>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
